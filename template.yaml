AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Loose Ends - Strands Agents Commitment Management (AWS Lambda + Amazon Bedrock)

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        MODEL_PROVIDER: bedrock
        BEDROCK_MODEL_ID: anthropic.claude-3-haiku-20240307-v1:0
        AWS_REGION: us-east-1

Resources:
  LooseEndsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: lambda_function.lambda_handler
      Runtime: python3.12
      Architectures:
        - x86_64
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource: "*"
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY

Outputs:
  LooseEndsApiUrl:
    Description: HTTP API Gateway endpoint URL for Loose Ends backend
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/"
